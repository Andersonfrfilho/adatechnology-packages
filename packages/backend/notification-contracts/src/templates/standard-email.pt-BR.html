<table role="presentation" width="620" cellpadding="0" cellspacing="0" border="0" style="width:620px;max-width:620px;margin:0 auto;background:#ffffff;font-family:Arial,Helvetica,sans-serif;color:#1d2b33">
  <tr>
    <td style="background:#10222c;padding:18px 24px">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td width="56" valign="middle" style="width:56px">{{logoEmpresa}}</td>
          <td valign="middle" style="padding-left:12px;font-size:17px;font-weight:bold;color:#ffffff">{{nomeEmpresa}}</td>
        </tr>
      </table>
    </td>
  </tr>
  <tr>
    <td style="padding:22px 24px 6px;font-size:14px;line-height:1.55;color:#1d2b33">{{corpoMensagem}}</td>
  </tr>
  <tr>
    <td style="padding:0 24px 12px">{{listaAnexos}}</td>
  </tr>
  <tr>
    <td style="padding:0 24px 16px">{{faixaResposta}}</td>
  </tr>
  <tr>
    <td style="padding:16px 24px;border-top:1px solid #d9ded8">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td width="40" height="40" align="center" valign="middle" style="width:40px;height:40px;background:#10222c;color:#ffffff;font-size:14px;font-weight:bold">{{iniciaisAssinante}}</td>
          <td valign="middle" style="padding-left:12px;font-size:13px;line-height:1.4">
            <div style="font-weight:bold;color:#10222c">{{nomeAssinante}}</div>
            <div style="color:#5a6b74">{{cargoAssinante}}</div>
          </td>
        </tr>
      </table>
    </td>
  </tr>
  <tr>
    <td align="center" style="background:#f0f2ee;padding:14px 24px;font-size:11px;line-height:1.5;color:#5a6b74">
      <div>{{rodapePlataforma}}</div>
      <div style="padding-top:8px">{{marcasRodape}}</div>
    </td>
  </tr>
</table>
