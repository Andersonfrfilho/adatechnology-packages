name: Publish packages

on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    # Only publish once CI has actually passed on main. workflow_run fires whether CI
    # succeeded or failed — without this guard a broken build (unrun tests, failed
    # typecheck) would still publish.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.28.2'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build:all

      - name: Version packages
        run: pnpm changeset version

      - name: Commit version bump
        env:
          HUSKY: 0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No version changes to commit"
          else
            git add -A
            git commit -m "chore(release): version packages"
            git push origin HEAD:main
          fi

      - name: Publish packages
        run: pnpm run publish:changesets
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Pacotes de escopo saem como restricted quando o package.json não declara
      # publishConfig.access, e o npm responde 404 para quem não tem acesso — o pacote
      # parece não existir. Os package.json agora declaram access: public, mas quem já
      # foi publicado antes disso precisa ser corrigido no registry uma vez.
      # `|| true`: uma vez públicos, repetir o comando é inofensivo, e um pacote ainda
      # não publicado não deve derrubar o job.
      - name: Ensure scoped packages are public
        run: |
          for pkg in \
            keycloak-jwt \
            secret-envelope \
            meta-graph-core \
            meta-whatsapp-contracts \
            meta-whatsapp-provider \
            meta-catalog-provider \
            meta-whatsapp-module \
            text-moderation \
            conversations-ui \
            products-ui
          do
            echo "--- @adatechnology/$pkg"
            npm access set status=public "@adatechnology/$pkg" || true
            npm view "@adatechnology/$pkg" version dist-tags || echo "    (não encontrado no registry)"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Quando um nome de pacote muda de dono — a implementação sai para um nome novo e o
      # nome antigo passa a carregar outra coisa — quem já dependia da linha antiga precisa
      # ver o aviso no próprio `npm install`. É o único lugar onde a mensagem alcança quem
      # não lê changelog. O registry guarda o aviso por versão, então repetir o comando a
      # cada release é inofensivo; `|| true` evita que uma linha ainda não publicada, ou uma
      # falha de rede no registry, derrube um release que já concluiu a publicação.
      - name: Deprecate legacy package lines
        run: |
          deprecate() {
            echo "--- $1"
            npm deprecate "$1" "$2" || true
          }

          # As duas primeiras versoes do provider de visao saíram com engine que nao funciona. O
          # aviso vive aqui porque e o unico lugar que alcanca quem ja instalou: ele aparece no
          # proprio `npm install`, e nao no changelog que ninguem le.
          deprecate "@adatechnology/product-vision-provider@0.1.0-rc.2" \
            "Versao com defeito: o leitor de codigo de barras usava nomes de formato que o zbar nao devolve, entao nenhuma foto era lida — a leitura voltava sempre vazia, sem erro. Use 0.1.0-rc.4 ou maior."

          deprecate "@adatechnology/product-vision-provider@0.1.0-rc.3" \
            "Versao com o engine CLIP quebrado: a imagem era passada como data URL e o transformers.js tenta buscar a URL, entao toda foto falhava com 404. O leitor de codigo de barras funciona nesta versao. Use 0.1.0-rc.4 ou maior."

          deprecate "@adatechnology/keycloak-admin@<=0.1.16" \
            "Este nome agora é o cliente agnóstico da Admin API (client_credentials, sem framework). A implementação NestJS mudou para @adatechnology/nestjs-keycloak-admin — troque o nome da dependência, o comportamento é o mesmo."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
