name: Publish packages

on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    # Only publish once CI has actually passed on main. workflow_run fires whether CI
    # succeeded or failed — without this guard a broken build (unrun tests, failed
    # typecheck) would still publish.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.28.2'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build:all

      - name: Version packages
        run: pnpm changeset version

      - name: Commit version bump
        env:
          HUSKY: 0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No version changes to commit"
          else
            git add -A
            git commit -m "chore(release): version packages"
            git push origin HEAD:main
          fi

      - name: Publish packages
        run: pnpm run publish:changesets
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Pacotes de escopo saem como restricted quando o package.json não declara
      # publishConfig.access, e o npm responde 404 para quem não tem acesso — o pacote
      # parece não existir.
      #
      # Este passo verifica o ESTADO FINAL, e não o resultado do comando. `npm access set`
      # devolve 403 quando o token publica mas não administra o escopo, e engolir esse 403
      # deixa o job verde sem nenhuma garantia de que o pacote ficou instalável.
      #
      # A lista é derivada do workspace, nunca escrita à mão. A versão anterior era uma lista
      # fixa de dez nomes: pacote criado depois dela nunca passava por aqui, e ninguém
      # descobria — o job continuava verde de qualquer forma.
      #
      # As tentativas com espera existem porque o registry leva alguns segundos para servir o
      # que acabou de receber; sem elas o passo acusaria falta do que estava só a caminho.
      - name: Verificar que os pacotes publicados estão acessíveis publicamente
        run: |
          faltando=""

          for manifest in packages/backend/*/package.json packages/frontend/*/package.json; do
            [ -f "$manifest" ] || continue

            nome=$(jq -r '.name' "$manifest")
            versao=$(jq -r '.version' "$manifest")
            privado=$(jq -r '.private // false' "$manifest")

            case "$nome" in @adatechnology/*) ;; *) continue ;; esac
            [ "$privado" = "true" ] && continue

            npm access set status=public "$nome" >/dev/null 2>&1 || true

            # Sem credencial, de propósito: é a visão de quem vai instalar. `npm view` com o
            # token do CI enxerga pacote privado e diria que está tudo bem.
            url="https://registry.npmjs.org/$(printf '%s' "$nome" | sed 's|/|%2f|')/$versao"

            publico=""
            for tentativa in 1 2 3; do
              if curl -fsS -o /dev/null "$url"; then publico=1; break; fi
              # O registry leva alguns segundos para propagar o que acabou de receber.
              sleep 10
            done

            if [ -n "$publico" ]; then
              echo "ok       $nome@$versao"
            else
              echo "FALTANDO $nome@$versao"
              faltando="$faltando $nome@$versao"
            fi
          done

          if [ -n "$faltando" ]; then
            echo
            echo "::error::Publicado com sucesso mas inacessível para quem instala:$faltando"
            echo "Torne o pacote público no registry (npm access set status=public) com uma conta"
            echo "que administre o escopo @adatechnology, ou dê essa permissão ao token do CI."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Quando um nome de pacote muda de dono — a implementação sai para um nome novo e o
      # nome antigo passa a carregar outra coisa — quem já dependia da linha antiga precisa
      # ver o aviso no próprio `npm install`. É o único lugar onde a mensagem alcança quem
      # não lê changelog. O registry guarda o aviso por versão, então repetir o comando a
      # cada release é inofensivo; `|| true` evita que uma linha ainda não publicada, ou uma
      # falha de rede no registry, derrube um release que já concluiu a publicação.
      - name: Deprecate legacy package lines
        run: |
          deprecate() {
            echo "--- $1"
            npm deprecate "$1" "$2" || true
          }

          # As duas primeiras versoes do provider de visao saíram com engine que nao funciona. O
          # aviso vive aqui porque e o unico lugar que alcanca quem ja instalou: ele aparece no
          # proprio `npm install`, e nao no changelog que ninguem le.
          deprecate "@adatechnology/product-vision-provider@0.1.0-rc.2" \
            "Versao com defeito: o leitor de codigo de barras usava nomes de formato que o zbar nao devolve, entao nenhuma foto era lida — a leitura voltava sempre vazia, sem erro. Use 0.1.0-rc.4 ou maior."

          deprecate "@adatechnology/product-vision-provider@0.1.0-rc.3" \
            "Versao com o engine CLIP quebrado: a imagem era passada como data URL e o transformers.js tenta buscar a URL, entao toda foto falhava com 404. O leitor de codigo de barras funciona nesta versao. Use 0.1.0-rc.4 ou maior."

          deprecate "@adatechnology/keycloak-admin@<=0.1.16" \
            "Este nome agora é o cliente agnóstico da Admin API (client_credentials, sem framework). A implementação NestJS mudou para @adatechnology/nestjs-keycloak-admin — troque o nome da dependência, o comportamento é o mesmo."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
